<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colour Picker · Just Tools</title>
  <link rel="stylesheet" href="../../shared/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <section class="tool-header">
      <div class="card-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-1 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.5-9-7.5Z"></path>
          <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="9.5" cy="7" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="14" cy="7" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="16.2" cy="10.3" r="1.1" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="tool-header-text">
        <h1>Colour Picker</h1>
        <p>Pick a color and see it live in HEX, RGB, and HSL. Click a value to copy it.</p>
      </div>
    </section>

    <div class="panel">
      <div class="field-row">
        <label for="color-input">Color</label>
        <input type="color" id="color-input" value="#c4623b" />
      </div>

      <div class="field-row">
        <label for="hex-value">HEX</label>
        <output id="hex-value" class="format-value"></output>
        <button type="button" data-copy-target="hex-value">Copy</button>
      </div>

      <div class="field-row">
        <label for="rgb-value">RGB</label>
        <output id="rgb-value" class="format-value"></output>
        <button type="button" data-copy-target="rgb-value">Copy</button>
      </div>

      <div class="field-row">
        <label for="hsl-value">HSL</label>
        <output id="hsl-value" class="format-value"></output>
        <button type="button" data-copy-target="hsl-value">Copy</button>
      </div>

      <p class="copy-status" id="copy-status" aria-live="polite"></p>
    </div>
  </main>

  <script src="../../shared/nav.js" data-home="../../index.html" data-title="Just Tools"></script>
  <script src="script.js"></script>
</body>
</html>
